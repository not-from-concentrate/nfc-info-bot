name: nfc-info-bot

services:
  bot:
    image: ghcr.io/not-from-concentrate/nfc-info-bot:0.1.2
    container_name: nfc-info-bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      COMMAND_URL: ${COMMAND_URL}
      ADMIN_USER: ${ADMIN_USER}
      LOG_CHANNEL: ${LOG_CHANNEL}
      BST_FORUM_CHANNEL: ${BST_FORUM_CHANNEL:-}
      BST_PRUNE_DELETE: ${BST_PRUNE_DELETE:-False}
      BST_PRUNE_MAX_AGE_DAYS: ${BST_PRUNE_MAX_AGE_DAYS:-183}
    volumes:
      - "~/nfc-info-bot_data:/db"
